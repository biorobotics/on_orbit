dist_capture_box_from_nozzle_opening: 0.02 # Distance from front of capture box Based on actual CV nozzle where distance of nozzle opening to goal is 0.4765 m
dist_centering_waypoint_from_goal: 0.4785 # dist_nozzle_opening_from_goal + dist_capture_box_from_nozzle_opening + 2*(ur16 repeatability + ur5 repeatability) + peg radius


